[package]
name = "oxml-json"
version = "0.0.8"
edition = "2024"
rust-version = "1.86.0"
license = "MIT OR Apache-2.0"
description = "A small JSON value, parser and serialiser for the oxml suite's JSON-RPC crates"
repository = "https://github.com/sebastienrousseau/oxml-json"
homepage = "https://github.com/sebastienrousseau/oxml-json"
documentation = "https://docs.rs/oxml-json"
readme = "README.md"
keywords = ["json", "json-rpc", "parser", "lsp", "mcp"]
categories = ["parser-implementations", "encoding"]
authors = ["Sebastien Rousseau <sebastian.rousseau@gmail.com>"]

# What reaches crates.io.
#
# Without this, cargo packages every tracked file: CI workflows, the
# dependabot config, .gitignore, the DCO, the governance documents.
# That is how oxml-json 0.0.8 shipped an assurance case describing a
# different crate -- a file nobody thought of as published, uploaded to
# a registry where nothing can be edited afterwards.
#
# Listed rather than excluded, so a new directory is absent by default
# instead of shipped by default.
include = [
    "/CHANGELOG.md",
    "/Cargo.toml",
    "/LICENSE",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/README.md",
    "/examples/**",
    "/src/**",
]

[dependencies]

[[example]]
name = "parse_and_build"
path = "examples/parse_and_build.rs"

[lints.rust]
missing_docs = "warn"
unused_results = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
